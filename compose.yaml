services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATA_DIR: "/app/data"
      MODELS_DIR: "/app/data/models"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      SECRET_KEY: "${SECRET_KEY:-change-me-please}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      INTEGRATION_TOKEN: "${INTEGRATION_TOKEN:-}"
      WIDGET_ALLOWED_ORIGINS: "${WIDGET_ALLOWED_ORIGINS:-*}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-claude-opus-5-5}"
      LLM_EFFORT: "${LLM_EFFORT:-low}"
      LLM_FALLBACKS: "${LLM_FALLBACKS:-1}"
      LLM_DISABLED: "${LLM_DISABLED:-0}"
      EMAIL_IMAP_HOST: "${EMAIL_IMAP_HOST:-}"
      EMAIL_IMAP_PORT: "${EMAIL_IMAP_PORT:-993}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-465}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_POLL_SECONDS: "${EMAIL_POLL_SECONDS:-60}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      MANAGER_TELEGRAM_CHAT_ID: "${MANAGER_TELEGRAM_CHAT_ID:-}"
      MANAGER_EMAIL: "${MANAGER_EMAIL:-}"
    volumes:
      - agent-data:/app/data
    restart: unless-stopped

volumes:
  agent-data:
