<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ doc.title }} № {{ doc.number }}{% endblock %}</title>
<style>
  @page { size: A4; margin: 14mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 13px; color: #111; margin: 0; background: #eef0f3; }
  .sheet { background: #fff; max-width: 210mm; margin: 16px auto; padding: 14mm; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .toolbar { max-width: 210mm; margin: 16px auto 0; display: flex; gap: 8px; justify-content: flex-end; }
  .toolbar a, .toolbar button { font: inherit; padding: 10px 18px; border-radius: 100px; border: 1px solid #c9ced6; background: #fff; color: #111; text-decoration: none; cursor: pointer; }
  .toolbar .primary { background: #1c1d20; border-color: #1c1d20; color: #fff; }
  h1 { font-size: 20px; margin: 18px 0 12px; }
  table { border-collapse: collapse; width: 100%; }
  .grid td, .grid th { border: 1px solid #444; padding: 4px 6px; vertical-align: top; }
  .grid th { background: #f3f4f6; font-weight: bold; text-align: center; }
  .num { text-align: right; white-space: nowrap; }
  .center { text-align: center; }
  .totals { margin-top: 8px; margin-left: auto; width: 55%; }
  .totals td { padding: 3px 6px; }
  .totals td:first-child { text-align: right; font-weight: bold; }
  .muted { color: #555; }
  .small { font-size: 11px; }
  .sign { margin-top: 36px; display: flex; gap: 40px; }
  .sign div { flex: 1; border-top: 1px solid #111; padding-top: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; font-size: 12px; }
  .brand { font-size: 26px; font-weight: 800; color: #b5172b; letter-spacing: .5px; }
  .draft { border: 2px dashed #c01e2e; color: #c01e2e; font-weight: bold; text-align: center; padding: 6px; margin-bottom: 14px; letter-spacing: 1px; }
  .grid th { font-size: 12px; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; margin: 0; padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/d/{{ doc.token }}.docx">Скачать DOCX</a>
  <button class="primary" onclick="window.print()">Печать / сохранить в PDF</button>
</div>
<div class="sheet">
{% block body %}{% endblock %}
</div>
</body>
</html>
